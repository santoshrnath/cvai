# =============================================================================
# CV Intelligence Agent — production compose
# =============================================================================
# Spins up:
#   - cvai-app   (Next.js, port ${CVAI_PORT:-3060})
#   - cvai-db    (Postgres 17 with pgvector — also usable as vector fallback)
#   - cvai-qdrant (Qdrant vector DB, ports 6333/6334)
#
# On Hetzner: routed by the shared Coolify-managed Traefik network.
# Locally:    just `docker compose up` and visit http://localhost:${CVAI_PORT}.
# =============================================================================
services:
  cvai-app:
    build: .
    container_name: cvai-app
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://cvai:cvai@cvai-db:5432/cvai?schema=public
      QDRANT_URL: http://cvai-qdrant:6333
    ports:
      - "${CVAI_PORT:-3060}:3000"
    depends_on:
      cvai-db:
        condition: service_healthy
      cvai-qdrant:
        condition: service_started
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cvai.rule=Host(`${PUBLIC_HOSTNAME:-cvai.localhost}`)"
      - "traefik.http.routers.cvai.entrypoints=websecure"
      - "traefik.http.routers.cvai.tls.certresolver=letsencrypt"
      - "traefik.http.services.cvai.loadbalancer.server.port=3000"
    networks:
      - cvai-net
      - coolify

  cvai-db:
    image: pgvector/pgvector:pg17
    container_name: cvai-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: cvai
      POSTGRES_PASSWORD: cvai
      POSTGRES_DB: cvai
    volumes:
      - cvai-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cvai"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - cvai-net

  cvai-qdrant:
    image: qdrant/qdrant:v1.12.0
    container_name: cvai-qdrant
    restart: unless-stopped
    volumes:
      - cvai-qdrant-data:/qdrant/storage
    networks:
      - cvai-net

volumes:
  cvai-db-data:
  cvai-qdrant-data:

networks:
  cvai-net:
  coolify:
    external: true
