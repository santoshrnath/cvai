# =============================================================================
# CV Intelligence Agent — production compose
# =============================================================================
# Spins up:
#   - cvai-app   (Next.js, port ${CVAI_PORT:-3060})
#   - cvai-db    (Postgres 17 with pgvector — also usable as vector fallback)
#   - cvai-qdrant (Qdrant vector DB, ports 6333/6334)
#
# On Hetzner: routed by the shared Coolify-managed Traefik network.
# Locally:    just `docker compose up` and visit http://localhost:${CVAI_PORT}.
# =============================================================================
services:
  cvai-app:
    build:
      context: .
      args:
        # Bake the Clerk publishable key into the client bundle. Server-side
        # CLERK_SECRET_KEY stays in `.env` at runtime.
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
    container_name: cvai-app
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://cvai:cvai@cvai-db:5432/cvai?schema=public
      QDRANT_URL: http://cvai-qdrant:6333
    ports:
      - "${CVAI_PORT:-3060}:3000"
    depends_on:
      cvai-db:
        condition: service_healthy
      cvai-qdrant:
        condition: service_started
    volumes:
      # Persist locally-stored CVs across container restarts. Swap to
      # STORAGE_PROVIDER=s3 (Hetzner Storage Box) to bypass this entirely.
      - cvai-storage:/app/storage-local
    labels:
      # Coolify-managed Traefik on this host uses `http` / `https` entrypoints
      # (not `web` / `websecure`). Match OpenStudio's label set exactly.
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      # Define the http→https redirect middleware locally so it's scoped to
      # this stack (referencing one defined in another compose stack doesn't
      # resolve under the docker provider).
      - "traefik.http.middlewares.cvai-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.cvai-http.entryPoints=http"
      - "traefik.http.routers.cvai-http.rule=Host(`${PUBLIC_HOSTNAME:-cv.oneplaceplatform.com}`)"
      - "traefik.http.routers.cvai-http.middlewares=cvai-redirect"
      - "traefik.http.routers.cvai-https.entryPoints=https"
      - "traefik.http.routers.cvai-https.rule=Host(`${PUBLIC_HOSTNAME:-cv.oneplaceplatform.com}`)"
      - "traefik.http.routers.cvai-https.tls=true"
      - "traefik.http.routers.cvai-https.tls.certresolver=letsencrypt"
      - "traefik.http.services.cvai.loadbalancer.server.port=3000"
    networks:
      - cvai-net
      - coolify

  cvai-db:
    image: pgvector/pgvector:pg17
    container_name: cvai-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: cvai
      POSTGRES_PASSWORD: cvai
      POSTGRES_DB: cvai
    volumes:
      - cvai-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cvai"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - cvai-net

  cvai-qdrant:
    # Pin to a recent stable that matches the @qdrant/js-client-rest major.
    image: qdrant/qdrant:v1.13.0
    container_name: cvai-qdrant
    restart: unless-stopped
    volumes:
      - cvai-qdrant-data:/qdrant/storage
    networks:
      - cvai-net

volumes:
  cvai-db-data:
  cvai-qdrant-data:
  cvai-storage:

networks:
  cvai-net:
  coolify:
    external: true
